# Phase 3 — KEDA autoscaling on a CUSTOM metric (the differentiator).
#
# Instead of scaling on CPU (meaningless for an inference server), scale on how
# many requests are IN FLIGHT — the `inflight` gauge from /metrics.json. When
# concurrent load climbs past the threshold, KEDA adds pods; when it drains, it
# scales back down after the cooldown.
#
# This uses KEDA's `metrics-api` scaler, which GETs the endpoint directly — no
# Prometheus to stand up, so the local demo has one moving part instead of three.
#
# NOTE (honesty): the ClusterIP service load-balances, so a single poll hits one
# pod's inflight, not the fleet sum. That's fine to trigger scaling in a demo;
# the production-correct version scrapes all pods with Prometheus and scales on
# `sum(inference_inflight_requests)` (the /metrics endpoint is already Prometheus
# format for exactly that upgrade).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: inference-server
spec:
  scaleTargetRef:
    name: inference-server        # the Deployment above
  minReplicaCount: 1
  maxReplicaCount: 6
  cooldownPeriod: 30              # seconds of quiet before scaling down
  pollingInterval: 5             # how often KEDA checks the metric
  triggers:
    - type: metrics-api
      metadata:
        url: "http://inference-server.default.svc.cluster.local/metrics.json"
        valueLocation: "queue_depth"
        targetValue: "2"          # ~2 queued requests per pod; deeper queue => scale out
