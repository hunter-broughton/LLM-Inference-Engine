# Phase 3 — the inference server Deployment (CPU / local-demo variant).
#
# KEDA owns the replica count (keda-scaledobject.yaml targets this by name), so
# DON'T set `replicas` here — let the ScaledObject drive it. For a real GPU
# deploy, add `resources.limits: {nvidia.com/gpu: 1}` and use the CUDA image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-server
  labels:
    app: inference-server
spec:
  selector:
    matchLabels:
      app: inference-server
  template:
    metadata:
      labels:
        app: inference-server
    spec:
      containers:
        - name: server
          # Built locally and loaded into kind with `kind load docker-image`, so
          # never pull from a registry.
          image: mini-llm-inference:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_NAME
              value: "gpt2"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5     # model is baked into the image, loads fast
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
